# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: Advanced Earth Science Data Analysis
author: Travis A. O'Brien
copyright: "2025"
logo: course_images/dall_e_2023-08-22_16_41_13_an_impressionist.png

# Force re-execution of notebooks on each build.
# See https://jupyterbook.org/content/execute.html
execute:
  execute_notebooks: force
  timeout: 600

# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: book.tex

# Add a bibtex file so that we can create citations
#bibtex_bibfiles:
#  - references.bib

# Information about where the book exists on the web
repository:
  url: https://github.com/taobrienlbl/advanced_earth_science_data_analysis # Online location of your book
  path_to_book: content  # Optional path to your book, relative to the repository root
  branch: fall_2025_iub  # Which branch of the repository should be used when creating links (optional)

# Add GitHub buttons to your book
# See https://jupyterbook.org/customize/config.html#add-a-link-to-your-repository
html:
  use_issues_button: true
  use_repository_button: true
  extra_head: |
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

# skip building README.md files
exclude_patterns : ["lessons/*/README.md"]

sphinx:
  config:
    html_extra_path: ['./course_images', './_static']
    # Removed non-existent cache-buster.css reference
    # Add cache control headers and force refresh
    html_theme_options:
      extra_footer: |
        <script>
        // Force refresh when navigating back to page from cache
        window.addEventListener('pageshow', function(event) {
          if (event.persisted) {
            window.location.reload();
          }
        });
        // Add timestamp to force browser refresh
        document.addEventListener('DOMContentLoaded', function() {
          var links = document.querySelectorAll('link[rel="stylesheet"]');
          links.forEach(function(link) {
            if (!link.href.includes('?v=')) {
              link.href += '?v=' + new Date().getTime();
            }
          });
          // Also add cache-busting to images
          var images = document.querySelectorAll('img');
          images.forEach(function(img) {
            if (img.src && !img.src.includes('?v=')) {
              img.src += '?v=' + new Date().getTime();
            }
          });
        });
        </script>

launch_buttons:
  notebook_interface: jupyterlab
  colab_url: "https://colab.research.google.com"
  binderhub_url: "https://mybinder.org"  # The URL for your BinderHub (e.g., https://mybinder.org)
  thebe: true