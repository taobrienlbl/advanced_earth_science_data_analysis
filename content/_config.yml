# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: Advanced Earth Science Data Analysis
author: Travis A. O'Brien
copyright: "2025"
logo: course_images/dall_e_2023-08-22_16_41_13_an_impressionist.png

# Force re-execution of notebooks on each build.
# See https://jupyterbook.org/content/execute.html
execute:
  execute_notebooks: force

# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: book.tex

# Add a bibtex file so that we can create citations
#bibtex_bibfiles:
#  - references.bib

# Information about where the book exists on the web
repository:
  url: https://github.com/taobrienlbl/advanced_earth_science_data_analysis # Online location of your book
  path_to_book: content  # Optional path to your book, relative to the repository root
  branch: fall_2025_iub  # Which branch of the repository should be used when creating links (optional)

# Add GitHub buttons to your book
# See https://jupyterbook.org/customize/config.html#add-a-link-to-your-repository
html:
  use_issues_button: true
  use_repository_button: true

# skip building README.md files
exclude_patterns : ["lessons/*/README.md"]

sphinx:
  config:
    html_extra_path: ['./course_images']
